<div class="menu-container">
    <!-- Header -->
    <div class="header">
        <div class="header-content">
          <h1 class="main-title">Annia Apps</h1>
          <p class="subtitle">Suite de aplicaciones para química computacional</p>
        </div>
    </div>

    <!-- Apps Grid -->
    <div class="apps-grid-wrapper">
      <div *ngFor="let app of apps" class="app-card" [class.app-easy-rate]="app.id === 'easy-rate'"
        [class.app-marcus]="app.id === 'marcus'" [class.app-molar]="app.id === 'molar-fraction'"
        [class.app-tunnel]="app.id === 'tunnel'" (click)="irA(app.ruta)" (keyup.enter)="irA(app.ruta)" role="button"
        tabindex="0">
    
        <!-- Icon Container -->
        <div class="icon-container">
          <img [src]="app.logo" [alt]="app.nombre + ' logo'" class="app-logo-img">
        </div>
    
        <!-- Card Content -->
        <div class="card-content">
          <h3 class="app-name">{{ app.nombre }}</h3>
          <p class="app-description">{{ app.descripcion }}</p>
            </div>
            
            <!-- Card Footer -->
            <div class="card-footer">
              <span class="btn-link">
                <span>Abrir</span>
                <svg class="arrow-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M 5 12 L 19 12 M 12 5 L 19 12 L 12 19" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </span>
            </div>
        </div>
    </div>
</div>
